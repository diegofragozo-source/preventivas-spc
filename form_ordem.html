<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Ordem de Manutenção</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f1117; color: #e0e0e0; font-size: 14px; min-height: 100vh; }
.header { background: #1a1a2e; border-bottom: 3px solid #ffe600; padding: 16px 20px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 10; }
.header .logo { background: #ffe600; border-radius: 8px; padding: 4px 10px; font-weight: 900; font-size: 13px; color: #1a1a1a; }
.header h1 { font-size: 15px; font-weight: 700; color: #fff; }
.ordem-badge { background: #22263a; margin: 16px; border-radius: 12px; padding: 16px; border: 1px solid #2a2d3e; }
.ordem-badge .num { font-size: 24px; font-weight: 900; color: #ffe600; }
.ordem-badge .titulo { font-size: 13px; color: #aaa; margin-top: 4px; line-height: 1.4; }
.ordem-badge .meta { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
.meta-chip { background: #1a2a3a; color: #64b5f6; border-radius: 6px; padding: 4px 10px; font-size: 11px; font-weight: 700; }
.form-body { padding: 0 16px 100px; display: flex; flex-direction: column; gap: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 12px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
.field input, .field select, .field textarea { background: #1e2133; border: 1.5px solid #2a2d3e; border-radius: 10px; padding: 12px 14px; color: #e0e0e0; font-size: 14px; width: 100%; transition: border-color .2s; }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: #ffe600; }
.field textarea { resize: vertical; min-height: 100px; line-height: 1.5; }
.section-title { font-size: 11px; font-weight: 800; color: #ffe600; text-transform: uppercase; letter-spacing: 1px; padding: 6px 0 2px; border-bottom: 1px solid #2a2d3e; }
.checklist { background: #1e2133; border: 1.5px solid #2a2d3e; border-radius: 10px; overflow: hidden; }
.check-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid #2a2d3e; cursor: pointer; }
.check-item:last-child { border-bottom: none; }
.check-item input[type="checkbox"] { width: 20px; height: 20px; accent-color: #ffe600; cursor: pointer; flex-shrink: 0; }
.check-item label { font-size: 13px; color: #ccc; cursor: pointer; flex: 1; }
.check-item.checked label { color: #4caf50; }
.status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.status-btn { padding: 14px 10px; border-radius: 10px; border: 2px solid #2a2d3e; background: #1e2133; color: #888; font-size: 12px; font-weight: 800; cursor: pointer; text-align: center; transition: all .15s; }
.status-btn.sel-nao  { border-color: #555; background: #252840; color: #aaa; }
.status-btn.sel-and  { border-color: #2196f3; background: #1a2a3a; color: #64b5f6; }
.status-btn.sel-atra { border-color: #ff9800; background: #3a2a1a; color: #ff9800; }
.status-btn.sel-con  { border-color: #4caf50; background: #1a2a1a; color: #81c784; }
.footer-fixed { position: fixed; bottom: 0; left: 0; right: 0; background: #13151f; border-top: 1px solid #2a2d3e; padding: 14px 16px; }
.btn-salvar { width: 100%; padding: 15px; background: #ffe600; color: #1a1a1a; border: none; border-radius: 12px; font-size: 15px; font-weight: 900; cursor: pointer; }
.btn-salvar:disabled { background: #444; color: #888; cursor: not-allowed; }
.toast { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); background: #4caf50; color: #fff; padding: 12px 24px; border-radius: 10px; font-weight: 800; font-size: 14px; z-index: 999; opacity: 0; transition: opacity .3s; pointer-events: none; white-space: nowrap; }
.toast.show { opacity: 1; }
.saved-banner { display: none; background: #1a2a1a; border: 1px solid #2a4a2a; border-radius: 8px; padding: 12px 14px; margin: 0 16px 8px; }
.saved-banner.show { display: block; }
.saved-banner p { font-size: 12px; color: #81c784; font-weight: 700; }
.saved-banner span { font-size: 11px; color: #666; }
</style>
</head>
<body>
<div class="header">
  <div class="logo">🔧</div>
  <h1>Ordem de Manutenção</h1>
</div>
<div class="ordem-badge">
  <div class="num" id="hOrdem">—</div>
  <div class="titulo" id="hTitulo">—</div>
  <div class="meta">
    <span class="meta-chip" id="hEquip"></span>
    <span class="meta-chip" id="hPlano"></span>
    <span class="meta-chip" id="hData"></span>
  </div>
</div>
<div class="saved-banner" id="savedBanner">
  <p>✅ Relatório já enviado anteriormente</p>
  <span id="savedInfo">—</span>
</div>
<div class="form-body">
  <p class="section-title">Identificação do Técnico</p>
  <div class="field"><label>Nome do Técnico *</label><input type="text" id="tecnico" placeholder="Seu nome completo"></div>
  <div class="field"><label>Data de Execução</label><input type="date" id="dataExec"></div>
  <div class="field"><label>Hora Início</label><input type="time" id="horaInicio"></div>
  <div class="field"><label>Hora Fim</label><input type="time" id="horaFim"></div>
  <p class="section-title">Checklist de Inspeção</p>
  <div class="checklist" id="checklist"></div>
  <p class="section-title">Observações</p>
  <div class="field"><label>Serviços realizados</label><textarea id="servicos" placeholder="Descreva os serviços realizados..."></textarea></div>
  <div class="field"><label>Anomalias encontradas</label><textarea id="anomalias" placeholder="Registre qualquer anomalia..."></textarea></div>
  <div class="field"><label>Materiais utilizados</label><input type="text" id="materiais" placeholder="Ex: Lubrificante, fusível 10A..."></div>
  <p class="section-title">Status da Ordem</p>
  <div class="status-grid">
    <button class="status-btn" data-val="nao"  onclick="selStatus('nao')">⏸ Não Iniciado</button>
    <button class="status-btn" data-val="and"  onclick="selStatus('and')">🔄 Em Andamento</button>
    <button class="status-btn" data-val="atra" onclick="selStatus('atra')">⚠️ Atrasado</button>
    <button class="status-btn" data-val="con"  onclick="selStatus('con')">✅ Concluído</button>
  </div>
</div>
<div class="footer-fixed">
  <button class="btn-salvar" id="btnSalvar" onclick="salvar()">💾 Salvar e Enviar Relatório</button>
</div>
<div class="toast" id="toast"></div>
<script>
const SCRIPT_URL = 'https://script.google.com/a/macros/mercadolivre.com/s/AKfycbwQqDA_LPQ9SkFE_O_NhWCDy8GXYz2G35bJ9xntSNpT6Nglhtpw7jJ2Xrmkf0nyelEefw/exec';

const params  = new URLSearchParams(window.location.search);
const ordem   = params.get('ordem')  || '';
const equip   = params.get('equip')  || '';
const plano   = params.get('plano')  || '';
const titulo  = params.get('titulo') || '';
const dataP   = params.get('data')   || '';
const semana  = params.get('semana') || '';

document.getElementById('hOrdem').textContent  = 'Ordem ' + (ordem || '—');
document.getElementById('hTitulo').textContent = titulo || '—';
if (equip)  document.getElementById('hEquip').textContent  = 'Equip: ' + equip;
if (plano)  document.getElementById('hPlano').textContent  = 'Plano: ' + plano;
if (dataP)  document.getElementById('hData').textContent   = 'Ini: ' + dataP;
if (semana) document.getElementById('hData').textContent   = 'Semana ' + semana;

const CHECKLISTS = {
  CLIMATIZACAO: ['Verificar filtros de ar','Limpar bandeja de condensação','Checar carga de gás refrigerante','Inspecionar rolamentos do ventilador','Verificar correia do ventilador','Limpar serpentina evaporadora','Verificar drenagem','Testar termostato','Medir corrente elétrica','Verificar painel elétrico'],
  ESTEIRA: ['Verificar tensão da correia','Lubrificar roletes','Inspecionar motor elétrico','Verificar alinhamento da correia','Checar sensores de presença','Inspecionar estrutura metálica','Verificar parafusos e fixações','Testar parada de emergência','Verificar correia transportadora','Medir corrente do motor'],
  NIVELADORA: ['Verificar cilindro hidráulico','Checar nível de óleo hidráulico','Inspecionar vedações','Verificar estrutura de aço','Testar sistema elétrico','Verificar fixações','Inspecionar rampa de acesso','Testar operação manual'],
  GERADOR: ['Verificar nível de combustível','Checar nível de óleo do motor','Inspecionar bateria','Verificar correia do alternador','Testar partida automática','Verificar sistema de arrefecimento','Inspecionar filtro de ar','Medir tensão de saída','Verificar disjuntores'],
  INCENDIO: ['Verificar pressão dos extintores','Inspecionar hidrantes','Testar detectores de fumaça','Verificar sprinklers','Checar sinalização de emergência','Testar sirene de alarme','Verificar central de alarme','Inspecionar mangueiras'],
  PAINEL: ['Medir temperatura do painel','Verificar conexões e bornes','Inspecionar disjuntores','Checar fusíveis','Verificar aterramento','Medir tensão entre fases','Inspecionar cabeamento','Verificar etiquetagem'],
  PORTA: ['Verificar vedação de borracha','Lubrificar dobradiças','Testar sistema de abertura','Inspecionar estrutura metálica','Verificar trava de segurança','Checar sensor de posição','Testar parada de emergência'],
  GERAL: ['Verificar condições gerais','Checar fixações e estrutura','Inspecionar sistema elétrico','Verificar sistema mecânico','Testar funcionamento','Registrar anomalias'],
};
function getChecklist() {
  const t = titulo.toUpperCase();
  if (t.includes('CLIMATIZ') || t.includes('AR COND')) return CHECKLISTS.CLIMATIZACAO;
  if (t.includes('ESTEIRA'))    return CHECKLISTS.ESTEIRA;
  if (t.includes('NIVELADORA')) return CHECKLISTS.NIVELADORA;
  if (t.includes('GERADOR'))    return CHECKLISTS.GERADOR;
  if (t.includes('INCÊNDIO') || t.includes('INCENDIO')) return CHECKLISTS.INCENDIO;
  if (t.includes('PAINEL') || t.includes('QUADRO'))     return CHECKLISTS.PAINEL;
  if (t.includes('PORTA'))      return CHECKLISTS.PORTA;
  return CHECKLISTS.GERAL;
}
const items = getChecklist();
const cl = document.getElementById('checklist');
cl.innerHTML = items.map((item, i) => `
  <div class="check-item" id="ci_${i}" onclick="toggleCheck(${i})">
    <input type="checkbox" id="cb_${i}">
    <label for="cb_${i}">${item}</label>
  </div>`).join('');

function toggleCheck(i) {
  const cb = document.getElementById('cb_'+i);
  cb.checked = !cb.checked;
  document.getElementById('ci_'+i).classList.toggle('checked', cb.checked);
}
let statusSel = '';
function selStatus(v) {
  statusSel = v;
  document.querySelectorAll('.status-btn').forEach(b => {
    b.className = 'status-btn' + (b.dataset.val === v ? ' sel-'+v : '');
  });
}
function showToast(msg, ok=true) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = ok ? '#4caf50' : '#f44336';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3500);
}

async function salvar() {
  const tecnico = document.getElementById('tecnico').value.trim();
  if (!tecnico) { showToast('⚠️ Informe o nome do técnico', false); return; }
  if (!statusSel) { showToast('⚠️ Selecione o status da ordem', false); return; }
  const checks = items.map((item, i) => ({item, ok: document.getElementById('cb_'+i).checked}));
  const relatorio = {
    ordem, equip, plano, titulo,
    semana: semana || null,
    tecnico,
    dataExec:   document.getElementById('dataExec').value,
    horaInicio: document.getElementById('horaInicio').value,
    horaFim:    document.getElementById('horaFim').value,
    checklist:  checks,
    servicos:   document.getElementById('servicos').value,
    anomalias:  document.getElementById('anomalias').value,
    materiais:  document.getElementById('materiais').value,
    status:     statusSel,
    enviadoEm:  new Date().toLocaleString('pt-BR'),
  };
  const btn = document.getElementById('btnSalvar');
  btn.disabled = true;
  btn.textContent = '⏳ Enviando...';
  try {
    const resp = await fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify(relatorio)
    });
    const json = await resp.json();
    if (json.ok) {
      showToast('✅ Relatório enviado com sucesso!');
      btn.textContent = '✅ Enviado!';
      btn.style.background = '#4caf50';
      document.getElementById('savedInfo').textContent = 'Por: ' + tecnico + ' em ' + relatorio.enviadoEm;
      document.getElementById('savedBanner').classList.add('show');
    } else {
      throw new Error(json.erro || 'Erro desconhecido');
    }
  } catch(e) {
    showToast('❌ Erro ao enviar. Tente novamente.', false);
    btn.disabled = false;
    btn.textContent = '💾 Salvar e Enviar Relatório';
  }
}

document.getElementById('dataExec').value = new Date().toISOString().split('T')[0];
const now = new Date();
document.getElementById('horaInicio').value = now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
</script>
</body>
</html>
